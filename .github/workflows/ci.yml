# Mirrors the local workflow exactly: the same commands as CONTRIBUTING.md
# "Checks", on the oldest and a current supported Python.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff format --check scripts tests
      - run: uv run ruff check scripts tests
      - run: uv run pytest -q
      - run: uv run python scripts/check_plugin.py

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      # Pinned so a new release can't change (or compromise) CI unannounced.
      - run: npm install -g --ignore-scripts @anthropic-ai/claude-code@2.1.309
      - run: claude plugin validate --strict .
